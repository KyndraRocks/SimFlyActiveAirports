name: Fetch SimFly Sky Ranking

# Pilot flight-activity feed, consumed by Recip Tracker's Balance Queue to tell
# prolific pilots from dormant ones. The /api/game/sky-rank endpoint is public
# (no auth, no cookies), so this is a plain server-side fetch — the apps cannot
# call it directly because SimFly sends no Access-Control-Allow-Origin on it.
#
# ONE SNAPSHOT PER UTC DAY, but scheduled HOURLY so a bad hour is not a lost
# day. This matters more here than for the sibling feeds: SimFly exposes only
# all/month/week/day, so the 90-day figure is synthesized from day-over-day
# deltas of the monotonic all-time counter. A missed day cannot be backfilled —
# the number simply never existed — whereas a stale payout feed self-corrects on
# the next run.
#
# The retry is free rather than brute force. The sweep reads the committed
# history file FIRST and exits before touching the network if today is already
# recorded, so on a normal day exactly one of the 24 runs does any work (the
# 05:20 one) and the other 23 cost a few seconds each. A failed run writes
# nothing at all, so the next hour just tries the whole sweep again. Individual
# page fetches also retry 3x in-run, which catches the common transient blip
# without spending a whole hour.
#
# Consequence: the day's sample is taken at the first hour that SUCCEEDS, so on
# a good day samples land at a consistent time and the deltas line up cleanly.
#
# See scripts/skyrank-sweep.js for the history format and its invariants.

on:
  schedule:
    - cron: '20 * * * *'   # hourly at :20 — first success of the day wins, the rest no-op
  workflow_dispatch:
    inputs:
      force:
        description: "Re-take today's snapshot even if one is already recorded"
        type: boolean
        default: false

# A slow sweep must never overlap itself: two runs writing the same day's
# snapshot would race on sky-rank-history.json.
concurrency:
  group: skyrank-sweep
  cancel-in-progress: false

jobs:
  fetch-skyrank:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Sweep sky ranking
        env:
          FORCE: ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '1' || '' }}
        run: node scripts/skyrank-sweep.js

      - name: Commit if changed
        run: |
          git add sky-rank.json sky-rank-history.json
          if git diff --cached --quiet; then
            echo "No changes — skipping commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: sky ranking $(date -u '+%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3; do
              if git push; then exit 0; fi
              echo "Push rejected (attempt $i) — pulling with rebase and retrying."
              git pull --rebase origin main
            done
            echo "Push still failing after 3 attempts." >&2
            exit 1
          fi
